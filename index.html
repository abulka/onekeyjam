<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OneKeyJam</title>


    <!-- jQuery and Fomantic UI are bundled from npm in src/vendor/index.js
    (previously loaded here from CDN). -->

    <!-- Web MIDI API is imported from the npm package in src/lib/midi/webmidi.js
    (no longer loaded here as a CDN global). -->

    <!-- Tonal is imported from npm node_modules -->

    <!-- In-browser sound now comes from the npm `soundfont-player` package
    (see src/lib/audio/general-midi-soundfont-player.js). The old WebAudioFont
    player and its soundfont data are no longer loaded. -->

    <!-- On-screen keyboard and pianoroll custom elements, self-hosted from
    public/vendor (the g200kg libraries have no npm package). -->
    <script src="/vendor/webaudio-controls.js"></script>
    <script src="/vendor/webaudio-pianoroll.js"></script>

    <link rel="stylesheet" href="/style/style.css">

    <!-- favicon - generated from https://favicon.io/favicon-converter/  -->
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon_io/favicon-16x16.png">
    <link rel="manifest" href="/favicon_io/site.webmanifest">

    <script>
      document.broadcastEvent = function broadcast(eventName, detailObject) {
          document.dispatchEvent(new CustomEvent(eventName, {
              detail: detailObject
          }));
      }
      document.addEventListener("hello", function (event) {
          console.log('Welcome to', event.detail.name);
      });
      document.broadcastEvent("hello", { name: "OneKeyJam!" })
  </script>

  <!-- Modules have access to <script src> namespaces, <script> namespace and to document and window -->

  
  </head>
  <body style="background-color: burlywood;">
    <div id="app"></div>

    <!-- boot vuejs, creates topmost App.vue which has its own onMounted() which runs before router views' onMounted() -->
    <script type="module" src="/src/main.js"></script>

    <!-- This is the last thing to run, after vue has loaded all the components and
    the UI is ready thus USELESS if router views need stuff to be set up first -->
    <script type="module">
    </script>

  </body>
</html>
